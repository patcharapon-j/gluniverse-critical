name: Release Module

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version and download URL in module.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node --eval '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            m.version = process.env.VERSION;
            m.manifest = `https://github.com/${process.env.REPO}/releases/latest/download/module.json`;
            m.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
          '

      - name: Create module.zip
        run: |
          zip -r module.zip \
            module.json \
            module.js \
            module.js.map \
            styles \
            templates \
            lang \
            README.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip
          fail_on_unmatched_files: true
